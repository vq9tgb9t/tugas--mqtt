# Exact room/topic grants; no wildcard writes, no cross-room publisher access.
user esp32-3s1
 topic write kampus2uinsaizu/gedung-saintek/ruang-3S1/temperature
 topic write kampus2uinsaizu/gedung-saintek/ruang-3S1/humidity
 topic write kampus2uinsaizu/gedung-saintek/ruang-3S1/status

# Optional local monitoring client; read only one room.
user monitor-3s1
 topic read kampus2uinsaizu/gedung-saintek/ruang-3S1/temperature
 topic read kampus2uinsaizu/gedung-saintek/ruang-3S1/humidity
 topic read kampus2uinsaizu/gedung-saintek/ruang-3S1/status
